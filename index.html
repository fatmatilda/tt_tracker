<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kai Angel — Track Tracker</title>
<style>
  :root{
    --bg:#08080a; --panel:#101014; --line:#242430;
    --txt:#e9e9ee; --dim:#8a8a99;
    --acc:#ff2e63; --acc2:#7c5cff;
    --old:#ffb020; --fin:#20e3a2;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
      radial-gradient(1100px 600px at 8% -12%, rgba(124,92,255,.20), transparent 62%),
      radial-gradient(900px 520px at 92% -6%, rgba(255,46,99,.16), transparent 62%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:34px 18px 90px}

  h1{
    margin:10px 0 12px; font-weight:900; letter-spacing:-.045em;
    font-size:clamp(30px,7vw,58px); line-height:.92;
    background:linear-gradient(115deg,#fff 8%,var(--acc) 46%,var(--acc2) 92%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h1 span{opacity:.35;-webkit-text-fill-color:var(--dim)}
  .sub{margin:0;color:var(--dim);font-size:14px;max-width:620px;line-height:1.55}

  /* --- загрузка файла --- */
  #loader{
    margin:30px 0; padding:44px 22px; text-align:center; cursor:pointer;
    border:1.5px dashed var(--line); border-radius:16px;
    background:rgba(255,255,255,.02); transition:.18s;
  }
  #loader:hover, #loader.drag{border-color:var(--acc2); background:rgba(124,92,255,.06)}
  #loader h2{margin:0 0 6px;font-size:16px}
  #loader p{margin:0;color:var(--dim);font-size:13px}
  #loader input{display:none}
  #loader .err{color:#ff7397;font-size:12px;margin-top:10px}

  /* --- статистика --- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0 18px}
  .stat{
    border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.01));
  }
  .stat .v{font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:800}
  .stat .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:3px}
  .stat.nm .v{color:#ff6b8f}
  .stat.old .v{color:var(--old)}
  .stat.fin .v{color:var(--fin)}

  .prog{display:flex;align-items:center;gap:12px;margin:0 0 22px}
  .prog .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);overflow:hidden}
  .prog .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--fin));transition:width .35s}
  .prog span{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim);white-space:nowrap}

  /* --- панель фильтров --- */
  .toolbar{
    position:sticky; top:0; z-index:30; padding:14px 0 12px; margin-bottom:6px;
    background:linear-gradient(180deg,rgba(8,8,10,.94),rgba(8,8,10,.75) 70%,transparent);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .trow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=search]{
    flex:1;min-width:200px;padding:11px 14px;border-radius:12px;font-size:14px;
    background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--txt);
    outline:none; font-family:inherit; transition:.18s;
  }
  input[type=search]::placeholder{color:#66666f}
  input[type=search]:focus{border-color:rgba(124,92,255,.7); box-shadow:0 0 0 3px rgba(124,92,255,.16)}

  .seg{display:flex;gap:4px;padding:4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);flex-wrap:wrap}
  .seg button{
    padding:7px 12px;border:0;border-radius:9px;background:transparent;color:var(--dim);
    font:600 12.5px/1 inherit; cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .seg button:hover{color:#fff;background:rgba(255,255,255,.06)}
  .seg button.active{background:rgba(255,255,255,.13);color:#fff}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{
    padding:6px 12px;border-radius:99px;border:1px solid var(--line);
    background:rgba(255,255,255,.025); color:var(--dim);
    font:600 12px/1 inherit; cursor:pointer; transition:.15s;
  }
  .chip:hover{color:#fff;border-color:#3b3b48}
  .chip.active{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(124,92,255,.35)}

  /* --- альбомы и треки --- */
  .album{
    margin:16px 0; overflow:hidden; border:1px solid var(--line); border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008));
  }
  .album-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
  .album-head:hover{background:rgba(255,255,255,.03)}
  .chev{width:10px;color:var(--dim);font-size:11px;transition:transform .22s;display:inline-block;text-align:center}
  .album.collapsed .chev{transform:rotate(-90deg)}
  .album-head h2{
    flex:1; min-width:0; margin:0; font-size:14px; letter-spacing:.1em;
    text-transform:uppercase; font-weight:800;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .abar{width:90px;height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;flex-shrink:0}
  .abar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--fin));border-radius:99px;transition:width .3s}
  .anum{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--dim);white-space:nowrap}
  .album.collapsed .tracks{display:none}
  .tracks{padding:4px 6px 8px}

  .track{display:flex;align-items:center;gap:14px;padding:8px 10px 8px 16px;border-radius:11px;position:relative;transition:background .12s}
  .track:hover{background:rgba(255,255,255,.04)}
  .track::before{content:'';position:absolute;left:4px;top:9px;bottom:9px;width:3px;border-radius:9px;background:transparent;transition:.18s}
  .track.is-nm::before{background:var(--acc)}
  .track.is-old::before{background:var(--old)}
  .track.is-fin::before{background:var(--fin);box-shadow:0 0 12px rgba(32,227,162,.65)}

  .tinfo{flex:1;min-width:0}
  .ttitle{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tartist{font-size:11.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track.is-fin .ttitle{color:#eafff7}

  .pills{display:flex;gap:6px;flex-shrink:0}
  .pill{
    padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;
    color:#6c6c78; font:700 10.5px/1 inherit; letter-spacing:.05em; text-transform:uppercase;
    cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .pill:hover{border-color:#3d3d4a;color:#c9c9d4}
  .pill.on.nm{background:rgba(255,46,99,.15);border-color:rgba(255,46,99,.55);color:#ff7397}
  .pill.on.old{background:rgba(255,176,32,.15);border-color:rgba(255,176,32,.55);color:#ffc860}
  .pill.on.fin{background:rgba(32,227,162,.15);border-color:rgba(32,227,162,.55);color:#4ff0bb}

  .empty{padding:70px 20px;text-align:center;color:var(--dim);font-size:15px;border:1px dashed var(--line);border-radius:16px;margin-top:20px}

  .foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
  .foot small{color:#5c5c68;font-size:11.5px;line-height:1.6}
  .btn-reset{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font:600 12px/1 inherit;cursor:pointer;transition:.15s}
  .btn-reset:hover{border-color:rgba(255,46,99,.6);color:#ff7397}

  [hidden]{display:none!important}

  @media (max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .track{flex-wrap:wrap;gap:8px}
    .pills{width:100%}
    .pill{flex:1;text-align:center}
    .abar{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>KAI ANGEL <span>//</span> TRACKLIST</h1>
    <p class="sub">Отмечай статус трека: <b>не сделан</b>, <b>старый</b>, <b>финал</b>. Фильтруй по альбомам и статусам. Статусы сохраняются в браузере.</p>
  </header>

  <div id="loader">
    <h2>Загрузи tracks.txt</h2>
    <p>Перетащи файл сюда или нажми, чтобы выбрать</p>
    <input type="file" accept=".txt,text/plain" id="file">
  </div>

  <div id="app" hidden>
    <section class="stats" id="stats"></section>
    <div class="prog">
      <div class="bar"><i id="progFill" style="width:0%"></i></div>
      <span id="progLabel">0%</span>
    </div>

    <div class="toolbar">
      <div class="trow">
        <input id="q" type="search" placeholder="Поиск…  ( / )" autocomplete="off">
        <div class="seg" id="statusSeg">
          <button data-status="all" class="active">Все</button>
          <button data-status="nm">Не сделано</button>
          <button data-status="old">Старые</button>
          <button data-status="fin">Финалы</button>
          <button data-status="none">Без статуса</button>
        </div>
      </div>
      <div class="chips" id="albumChips"></div>
    </div>

    <main id="list"></main>

    <footer class="foot">
      <small>Клик по «Не сделан / Старый / Финал» переключает статус.<br>Клик по названию альбома — свернуть.</small>
      <button class="btn-reset" id="resetAll">Сбросить статусы</button>
    </footer>
  </div>
</div>

<script>
/* ============ парсинг tracks.txt ============ */
function parse(raw){
  const albums = [{ name: 'Синглы', tracks: [] }];
  let cur = albums[0];

  for (const line of raw.split('\n')){
    const t = line.trim();
    if (!t) continue;

    if (t.startsWith('---')){
      cur = { name: t.replace(/^-+\s*/, '').trim() || 'Без названия', tracks: [] };
      albums.push(cur);
      continue;
    }

    const i = t.indexOf(' - ');
    const artist = i === -1 ? '' : t.slice(0, i).trim();
    const title  = i === -1 ? t : t.slice(i + 3).trim();

    cur.tracks.push({ key: cur.name + '||' + t, artist, title, album: cur.name });
  }
  return albums;
}

/* ============ состояние ============ */
const STORE = 'kai_angel_tracker_v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch(e){ state = {}; }
const save = () => localStorage.setItem(STORE, JSON.stringify(state));
const get = k => state[k] || (state[k] = { nm:0, old:0, fin:0 });

/* ============ данные ============ */
let ALBUMS = [];
let ALL = [];
const filters = { q:'', album:'all', status:'all' };
const collapsed = new Set();

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ фильтры ============ */
function passes(t){
  const s = state[t.key] || {};
  if (filters.status === 'nm'   && !s.nm)  return false;
  if (filters.status === 'old'  && !s.old) return false;
  if (filters.status === 'fin'  && !s.fin) return false;
  if (filters.status === 'none' && (s.nm || s.old || s.fin)) return false;

  if (filters.q){
    const hay = (t.title + ' ' + t.artist + ' ' + t.album).toLowerCase();
    if (!hay.includes(filters.q.toLowerCase())) return false;
  }
  return true;
}

/* ============ рендер ============ */
const $list   = document.getElementById('list');
const $stats  = document.getElementById('stats');
const $chips  = document.getElementById('albumChips');

function trackHTML(t){
  const s = state[t.key] || {};
  const cls = [s.nm && 'is-nm', s.old && 'is-old', s.fin && 'is-fin'].filter(Boolean).join(' ');
  return `<div class="track ${cls}" data-k="${esc(t.key)}">
    <div class="tinfo">
      <div class="ttitle">${esc(t.title)}</div>
      ${t.artist ? `<div class="tartist">${esc(t.artist)}</div>` : ''}
    </div>
    <div class="pills">
      <button class="pill nm ${s.nm ? 'on' : ''}" data-f="nm">Не сделан</button>
      <button class="pill old ${s.old ? 'on' : ''}" data-f="old">Старый</button>
      <button class="pill fin ${s.fin ? 'on' : ''}" data-f="fin">Финал</button>
    </div>
  </div>`;
}

function render(){
  let html = '', shown = 0;

  for (const al of ALBUMS){
    if (filters.album !== 'all' && al.name !== filters.album) continue;
    const visible = al.tracks.filter(passes);
    if (!visible.length) continue;
    shown += visible.length;

    const fin = al.tracks.filter(t => state[t.key]?.fin).length;
    const pct = al.tracks.length ? Math.round(fin / al.tracks.length * 100) : 0;
    const col = collapsed.has(al.name);

    html += `<section class="album ${col ? 'collapsed' : ''}">
      <div class="album-head" data-collapse="${esc(al.name)}">
        <span class="chev">▾</span>
        <h2>${esc(al.name)}</h2>
        <span class="abar"><i style="width:${pct}%"></i></span>
        <span class="anum">${fin}/${al.tracks.length}</span>
      </div>
      <div class="tracks">${visible.map(trackHTML).join('')}</div>
    </section>`;
  }

  $list.innerHTML = shown ? html : `<div class="empty">Ничего не найдено — измени фильтры 👀</div>`;
  updateStats();
}

function updateStats(){
  let nm=0, old=0, fin=0;
  for (const t of ALL){
    const s = state[t.key]; if (!s) continue;
    if (s.nm) nm++; if (s.old) old++; if (s.fin) fin++;
  }
  const total = ALL.length;
  const pct = total ? Math.round(fin/total*100) : 0;

  $stats.innerHTML = `
    <div class="stat"><div class="v">${total}</div><div class="l">Всего</div></div>
    <div class="stat nm"><div class="v">${nm}</div><div class="l">Не сделано</div></div>
    <div class="stat old"><div class="v">${old}</div><div class="l">Старых</div></div>
    <div class="stat fin"><div class="v">${fin}</div><div class="l">Финалов</div></div>`;

  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = `${pct}% · ${fin}/${total}`;
}

function buildChips(){
  let html = `<button class="chip active" data-album="all">Все релизы</button>`;
  for (const al of ALBUMS){
    html += `<button class="chip" data-album="${esc(al.name)}">${esc(al.name)} <span style="opacity:.5">${al.tracks.length}</span></button>`;
  }
  $chips.innerHTML = html;
}

/* ============ события ============ */
$list.addEventListener('click', e => {
  const pill = e.target.closest('[data-f]');
  if (pill){
    const k = pill.closest('.track').dataset.k;
    const s = get(k);
    s[pill.dataset.f] ^= 1;
    save(); render();
    return;
  }
  const head = e.target.closest('[data-collapse]');
  if (head){
    const name = head.dataset.collapse;
    collapsed.has(name) ? collapsed.delete(name) : collapsed.add(name);
    head.parentElement.classList.toggle('collapsed');
  }
});

let qTimer;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { filters.q = e.target.value.trim(); render(); }, 120);
});

document.getElementById('statusSeg').addEventListener('click', e => {
  const btn = e.target.closest('button[data-status]'); if (!btn) return;
  filters.status = btn.dataset.status;
  e.currentTarget.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

$chips.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  filters.album = chip.dataset.album;
  $chips.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
  render();
});

document.getElementById('resetAll').addEventListener('click', () => {
  if (!confirm('Сбросить все статусы?')) return;
  state = {}; save(); render();
});

document.addEventListener('keydown', e => {
  const q = document.getElementById('q');
  if (e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement === q){ q.value=''; filters.q=''; q.blur(); render(); }
});

/* ============ загрузка файла ============ */
const $loader = document.getElementById('loader');
const $file = document.getElementById('file');
const $app = document.getElementById('app');

function loadText(text){
  ALBUMS = parse(text);
  ALL = ALBUMS.flatMap(a => a.tracks);
  if (!ALL.length){
    $loader.querySelector('.err')?.remove();
    $loader.insertAdjacentHTML('beforeend', '<div class="err">В файле не найдено треков</div>');
    return;
  }
  $loader.hidden = true;
  $app.hidden = false;
  buildChips();
  render();
}

function readFile(file){
  const r = new FileReader();
  r.onload = () => loadText(r.result);
  r.readAsText(file, 'utf-8');
}

$loader.addEventListener('click', () => $file.click());
$file.addEventListener('change', () => { if ($file.files[0]) readFile($file.files[0]); });

['dragenter','dragover'].forEach(ev => $loader.addEventListener(ev, e => {
  e.preventDefault(); $loader.classList.add('drag');
}));
['dragleave','drop'].forEach(ev => $loader.addEventListener(ev, e => {
  e.preventDefault(); $loader.classList.remove('drag');
}));
$loader.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) readFile(f);
});

/* автозагрузка, если файл открыт через HTTP-сервер */
(async () => {
  try {
    const r = await fetch('tracks.txt', { cache: 'no-store' });
    if (r.ok) loadText(await r.text());
  } catch(_){ /* открыт как file:// — ждём ручной выбор */ }
})();
</script>
</body>
</html>
